spring:
  application:
    name: k8s-kind-hpa-app
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    url: jdbc:h2:mem:employeedb
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: 'false'
logging:
  level:
    org:
      springframework: WARN
    root: INFO
server:
  port: '8080'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,db